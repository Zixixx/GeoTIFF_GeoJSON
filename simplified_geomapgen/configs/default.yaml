# 默认配置文件
model:
  name: /path/to/local/qwen/model     # 本地Qwen模型目录
  backbone: /path/to/local/dino/model # 本地DINO模型目录
  max_features: 50
  max_points_per_feature: 100

data:
  image_root: /path/to/geotiff/images    # 训练/测试影像根目录
  label_root: /path/to/geojson/labels    # GeoJSON标注根目录
  mask_root: /path/to/masks             # mask文件根目录（可选）
  tile_size_px: 896     # patch切分大小
  overlap_px: 0         # patch重叠像素
  min_mask_ratio: 0.02  # 最小mask覆盖率

training:
  batch_size: 4         # 训练批次大小
  learning_rate: 1e-4   # 学习率
  epochs: 10           # 训练轮数
  save_steps: 500      # 检查点保存步数

inference:
  batch_size: 1        # 推理批次大小
  output_dir: ./outputs # 推理结果输出目录